apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cube-studio
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/AndyStan112/cube_studio.git
  ref:
    branch: master
  secretRef:
    name: cube-studio-git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cube-studio
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: cube-studio
  path: ./deploy/app
  prune: true
  deletionPolicy: Orphan
  wait: true
