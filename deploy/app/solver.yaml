apiVersion: v1
kind: Service
metadata:
  name: solver
spec:
  selector:
    app: solver
  ports:
    - port: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solver
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: solver
  template:
    metadata:
      labels:
        app: solver
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      volumes:
        - name: solver-tmp
          emptyDir:
            sizeLimit: 512Mi
      containers:
        - name: solver
          image: cube-solver
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: solver-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /ready
              port: 8081
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 20
