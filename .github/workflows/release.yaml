name: release
on:
  push:
    branches: [master]
    paths-ignore:
      - "deploy/app/kustomization.yaml"
      - "**/*.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-master
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest backend/tests
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/andystan112/cube_studio-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/andystan112/cube_studio-${{ matrix.service }}:master
          labels: |
            org.opencontainers.image.source=https://github.com/AndyStan112/cube_studio
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
  integration:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install -r backend/requirements.txt
      - run: docker compose -f compose.yaml -f compose.ci.yaml pull
      - run: docker compose -f compose.yaml -f compose.ci.yaml up -d --no-build
      - name: Test API with MongoDB
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:5173/api/health; then break; fi
            sleep 2
          done
          CUBE_API_URL=http://localhost:5173/api PYTHONPATH=backend pytest backend/tests
      - run: docker compose -f compose.yaml -f compose.ci.yaml logs --tail 100
        if: failure()
      - run: docker compose -f compose.yaml -f compose.ci.yaml down
        if: always()
  deploy:
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pin successful build
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'deploy/app/kustomization.yaml';
            const {owner, repo} = context.repo;
            for (let attempt = 0; attempt < 3; attempt++) {
              const {data} = await github.rest.repos.getContent({owner, repo, path, ref: 'master'});
              const previous = Buffer.from(data.content, 'base64').toString('utf8');
              const matches = previous.match(/newTag: .*/g) || [];
              if (matches.length !== 2) throw new Error('Expected two image references');
              const next = previous.replace(/newTag: .*/g, 'newTag: ' + context.sha);
              if (next === previous) break;
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path, branch: 'master', sha: data.sha,
                  message: 'deploy', content: Buffer.from(next).toString('base64'),
                });
                break;
              } catch (error) {
                if (error.status !== 409 || attempt === 2) throw error;
              }
            }
