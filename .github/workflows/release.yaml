name: release
on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-master
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.12"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
        working-directory: frontend
      - run: node --test .github/scripts/*.test.cjs
      - run: npm test
        working-directory: frontend
      - run: uv sync --project backend --locked
      - run: uv run --project backend --locked pytest backend/tests
  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/andystan112/cube_studio-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/andystan112/cube_studio-${{ matrix.service }}:master
          labels: |
            org.opencontainers.image.source=https://github.com/AndyStan112/cube_studio
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
  integration:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.12"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: uv sync --project backend --locked
      - run: docker compose -f compose.yaml -f compose.ci.yaml pull
      - run: docker compose -f compose.yaml -f compose.ci.yaml up -d --no-build
      - name: Report container state
        if: failure()
        run: |
          uv run --project backend --locked python - <<'PYTHON'
          import json, subprocess
          ids = subprocess.check_output(['docker', 'compose', '-f', 'compose.yaml', '-f', 'compose.ci.yaml', 'ps', '-aq'], text=True).split()
          for container in ids:
              data = json.loads(subprocess.check_output(['docker', 'inspect', container], text=True))[0]
              state = data['State']
              safe = {'container': data['Name'], 'status': state['Status'], 'exit_code': state['ExitCode'], 'health': state.get('Health', {}).get('Status')}
              print('::error::' + json.dumps(safe))
              if data.get('Config', {}).get('Labels', {}).get('com.docker.compose.service') == 'mongo':
                  logs = subprocess.run(['docker', 'logs', container], capture_output=True, text=True)
                  text = logs.stdout + logs.stderr
                  error_ids = []
                  for line in text.splitlines():
                      try:
                          record = json.loads(line)
                      except ValueError:
                          continue
                      if record.get('s') in ('E', 'F') and isinstance(record.get('id'), int):
                          error_ids.append(record['id'])
                  categories = [value for value in ('Permission denied', 'Operation not permitted', 'No space left on device', 'Invalid argument', 'Read-only file system', 'UnsupportedFormat', 'DBPathInUse') if value in text]
                  print('::error::' + json.dumps({'mongo_error_ids': error_ids, 'known_error_categories': categories}))
          PYTHON
      - name: Test API with MongoDB
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:5173/api/health; then break; fi
            sleep 2
          done
          CUBE_API_URL=http://localhost:5173/api uv run --project backend --locked pytest backend/tests
      - run: docker compose -f compose.yaml -f compose.ci.yaml logs --tail 100
        if: failure()
      - run: docker compose -f compose.yaml -f compose.ci.yaml down
        if: always()
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: integration
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish deployment snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-deployment.cjs`);
            await publish({github, context, core});
