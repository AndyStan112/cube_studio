[workspace]
members = [".", "vendor/min2phase"]
resolver = "2"

[package]
name = "solver-worker"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
signal-hook = "0.3"
min2phase = { path = "vendor/min2phase" }

[profile.release]
lto = "thin"
