server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location = /healthz { access_log off; return 200 "ok"; }
    location = /sw.js { add_header Cache-Control "no-store" always; }
    location = /index.html { add_header Cache-Control "no-store" always; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-store" always; }
    location /api/solver/ {
        client_max_body_size 8k;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        add_header Cache-Control "no-store" always;
    }
    location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
