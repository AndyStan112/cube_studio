# Test exactly the selected combination, including unchanged pinned images.
services:
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
  solver:
    image: ${SOLVER_IMAGE:?Set SOLVER_IMAGE}
  mongo:
    # Let glibc own rseq so TCMalloc uses thread caches on affected CI kernels.
    # https://github.com/docker-library/mongo/issues/765 (SERVER-121912)
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
